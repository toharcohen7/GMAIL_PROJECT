services:
  base:
    build:
      context: .
    image: gmail_project
    command: sleep infinity

  server:
    image: gmail_project
    container_name: gmail_server
    command: /usr/src/mytest/build/runServer ${SERVER_PORT} ${BF_SIZE} ${HASH_COUNTS}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - BF_SIZE=${BF_SIZE}
      - HASH_COUNTS=${HASH_COUNTS}
    depends_on:
      - base

  node:
    image: gmail_project
    container_name: gmail_node
    command: node /usr/src/mytest/src/app.js ${NODE_PORT} ${SERVER_PORT} ${SERVER_HOST}
    ports:
      - "${NODE_PORT}:${NODE_PORT}"
    environment:
      - NODE_PORT=${NODE_PORT}
      - SERVER_PORT=${SERVER_PORT}  
      - SERVER_HOST=${SERVER_HOST}
    depends_on:
      - server

  client:
    image: gmail_project
    container_name: gmail_client
    working_dir: /usr/src/mytest/src/client
    # Use development mode for flexible environment variables
    command: npm start
    ports:
      - "3000:3000"
    environment:
      # This is the key change - dynamically set API URL
      - REACT_APP_API_URL=http://localhost:${NODE_PORT}
      - CHOKIDAR_USEPOLLING=true  # For file watching in Docker
    depends_on:
      - node
