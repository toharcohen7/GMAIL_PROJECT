services:
  base:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmail_project
    command: sleep infinity
    volumes:
      - .:/usr/src/mytest
      - /usr/src/mytest/node_modules
      - /usr/src/mytest/src/server/node_modules
      - /usr/src/mytest/src/client/node_modules

  server:
    image: gmail_project
    container_name: gmail_server
    command: /usr/src/mytest/build/runServer ${SERVER_PORT} ${BF_SIZE} ${HASH_COUNTS}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - BF_SIZE=${BF_SIZE}
      - HASH_COUNTS=${HASH_COUNTS}
    depends_on:
      - base

  node:
    image: gmail_project
    container_name: gmail_node
    command: node /usr/src/mytest/src/server/app.js ${NODE_PORT} ${SERVER_PORT} ${SERVER_HOST} ${MONGO_CONNECTION}
    ports:
      - "${NODE_PORT}:${NODE_PORT}"
    environment:
      - NODE_PORT=${NODE_PORT}
      - SERVER_PORT=${SERVER_PORT}  
      - SERVER_HOST=${SERVER_HOST}
      - MONGO_CONNECTION=${MONGO_CONNECTION}
    depends_on:
      - server
      - base

  client:
    image: gmail_project
    container_name: gmail_client
    working_dir: /usr/src/mytest/src/client
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:${NODE_PORT}
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=0
    depends_on:
      - node
      - base

  mongo:
    image: mongo:latest
    container_name: gmail_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: